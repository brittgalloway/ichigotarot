    <div class="container">
        <header id="header">
            <h1>Shop</h1>
            <hr>
            <p>Luxury tarot and publishing</p>
        </header>
        <main>
            <section id="catalog" x-data="productGrid()">
                <p x-show="loading">Loading products&hellip;</p>
                <p x-show="error">Something went wrong loading the shop. Please refresh.</p>
                <div id="products">
                    <div class="product-wrapper" x-show="!loading && !error">
                        <template x-for="product in products" :key="product.slug">
                            <a class="product"
                                :href="`./product.html?slug=${product.slug}`"
                                :aria-label="`View ${product.title} details.`">
                                <img :src="product.img" :alt="product.title" />
                                <span x-text="product.title"></span>
                                <span class="cta" x-text="displayPrice(product)"></span>
                            </a>
                        </template>
                    </div>
                </div>
            </section>  
        </main>
        <site-cart></site-cart>
        <site-footer></site-footer>
    </div>
