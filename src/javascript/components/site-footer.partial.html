<footer>
    <div class="contact">
        <h2 id="in-touch">Keep in Touch</h2>
        <div id="social-media">
            <a href="https://www.instagram.com/ichigotarotstudio/">instagram</a>
            <a href="https://www.tiktok.com/@ichigostudios">tiktok</a>
        </div>
        <!-- <div class="ml-embedded" data-form="vGIgFX"></div> -->
        <form
            id="signup-form"
            x-data="signupForm()"
            @submit.prevent="submitForm"
            novalidate
        >
            <legend>Join our Newsletter</legend>
            <div class="field" :class="{ 'field--error': errors.name }">
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder=" "
                    x-model="fields.name"
                    autocomplete="name"
                    required
                    :aria-invalid="errors.name ? 'true' : 'false'"
                    aria-describedby="name-error"
                    aria-errormessage="name-error"
                    @blur="validateField('name')"
                    maxlength="200"
                >
                <label for="name">Name:</label>
                <p class="field-error" id="name-error" x-show="errors.name" x-text="errors.name" role="alert">Please enter your name.</p>
            </div>

            <div class="field" :class="{ 'field--error': errors.email }">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder=" "
                    x-model="fields.email"
                    autocomplete="email"
                    required
                    :aria-invalid="errors.email ? 'true' : 'false'"
                    aria-errormessage="email-error"
                    aria-describedby="email-error"
                    @blur="validateField('email')"
                    maxlength="250"
                >
                <label for="email">Email:</label>
                <p class="field-error" id="email-error" x-show="errors.email" x-text="errors.email" role="alert">Please enter a valid email address.</p>
            </div>

            <button type="submit" :disabled="status === 'submitting'">
                <span x-show="status !== 'submitting'">Submit</span>
                <span x-show="status === 'submitting'">Submitting…</span>
            </button>

            <p
                class="form-status form-status--error"
                x-show="status === 'error'"
                role="alert"
            >
                <span x-text="serverError"></span>
            </p>
        </form>
        <small>We won't share your data.</small>
    </div>
    <nav x-data="siteFooter()" class="collections" x-show="collections.length > 0">
        <h2>Collections</h2>
        <ul>
            <template x-for="collection in collections" :key="collection">
                <li>
                    <a :href="'../catalog.html?collection=' + encodeURIComponent(collection)" x-text="collection"></a>
                </li>
            </template>
        </ul>
    </nav>
    <nav class="terms">
        <h2>Info</h2>
        <ul>
            <li>
                <a href="/policies.html">Policies</a>
            </li>
            <li>
                <a href="/terms-conditions.html">Terms & Conditions</a>
            </li>
        </ul>
    </nav>
    <p>Ichigo Tarot 2026</p>
</footer>
