    <div class="container" x-data="productPage()">
        <header id="header">
            <h1 x-text="loading ? 'Loading...' : (product ? product.title : 'Product Not Found')"></h1>
        </header>
        <main>
            <section id="product-details">
                <p x-show="loading">Loading product&hellip;</p>
                <template x-if="!loading && error">
                    <div>
                        <p>We couldn&apos;t find that product.</p>
                        <a href="./catalog.html" class="button">Back to Shop</a>
                    </div>
                </template>
                <template x-if="!loading && !error && product">
                    <div class="product-detail">
                        <img :src="displayImage" :alt="product.title" />

                        <h2 x-text="product.title"></h2>
                        <p class="price" x-text="displayPrice"></p>
                        <fieldset x-show="product.variants.length > 1">
                            <legend>Options</legend>
                            <template x-for="variant in product.variants" :key="variant.label">
                                <button
                                    type="button"
                                    @click="selectVariant(variant)"
                                    :aria-pressed="selectedVariant ===variant"
                                    :class="{ selected: selectedVariant === variant }"
                                    x-text="variant.label"></button>
                            </template>
                        </fieldset>
                        <button type="button" class="button" @click="addToCart()">Add to Cart</button>
                        <div class="product-description">
                            <h3>Description</h3>
                            <p x-text="product.description"></p>
                        </div>
                    </div>
                </template>
            </section>  
        </main>
        <site-cart></site-cart>
        <site-footer></site-footer>
    </div>
